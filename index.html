<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影片時間碼筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky header with three tabs; video page = player beside a timecode rail (stacks on phones). Timecode chips borrow broadcast-amber. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#e4e9ef; --fg:#17202b; --muted:#5b6878; --line:#d3dae3;
  --accent:#a85a06; --accent-ink:#ffffff; --tc-bg:#fff1d6; --tc-fg:#874400; --danger:#b42318; --danger-bg:#fdecea; --hl:#ffe08a; --active:#fff8ea;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#171e27; --surface-2:#1f2833; --fg:#e6ebf1; --muted:#93a0b0; --line:#2a3441;
  --accent:#f0a530; --accent-ink:#1a1206; --tc-bg:#2d2210; --tc-fg:#ffc45e; --danger:#ff7b6b; --danger-bg:#2e1614; --hl:#6b4d00; --active:#221c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#171e27; --surface-2:#1f2833; --fg:#e6ebf1; --muted:#93a0b0; --line:#2a3441;
  --accent:#f0a530; --accent-ink:#1a1206; --tc-bg:#2d2210; --tc-fg:#ffc45e; --danger:#ff7b6b; --danger-bg:#2e1614; --hl:#6b4d00; --active:#221c12; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
img{max-width:100%}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.02em}
.brand .tc{font-family:var(--f-mono);font-size:12px;background:var(--tc-bg);color:var(--tc-fg);padding:2px 7px;border-radius:5px;font-weight:700}
.bar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
nav button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.auth{font-size:13px;display:flex;gap:6px;align-items:center}
.admin-badge{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 8px;border-radius:999px}
.banner{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.banner .wrap{padding-block:8px}

main{padding-block:24px 64px}
h1{font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.danger-outline{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:transparent}
.btn.danger-outline:hover{background:var(--danger-bg)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[readonly]{border-color:transparent;background:transparent;box-shadow:none;padding-left:0}
textarea{resize:vertical;min-height:70px}
.tcin{font-family:var(--f-mono);width:110px!important;flex:none}

.tc-chip{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;background:var(--tc-bg);color:var(--tc-fg);padding:3px 9px;border-radius:6px;text-decoration:none;white-space:nowrap;display:inline-block}
a.tc-chip:hover{outline:1px solid var(--tc-fg)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid transparent;cursor:pointer;font-weight:500;white-space:nowrap}
.tag:hover{color:var(--fg);border-color:var(--line)}
.tag[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.channel{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500}

/* Library */
.lib-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--muted)}
.thumb{aspect-ratio:16/9;max-width:100%;background:var(--surface-2);position:relative;display:grid;place-items:center;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.thumb .count{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:12px;background:rgba(0,0,0,.72);color:#fff;padding:2px 7px;border-radius:5px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card-title{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.peek{display:flex;gap:8px;align-items:baseline;font-size:13px;min-width:0}
.peek span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);min-width:0}

/* Video page */
.vid-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.vid-layout{grid-template-columns:minmax(0,1fr)}}
.player-box{aspect-ratio:16/9;max-width:100%;background:#000;border-radius:var(--r);overflow:hidden;position:relative}
.player-box iframe,#yt-player{width:100%;height:100%;display:block;border:0}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px;color:#dfe5ec;background:#121820;font-size:14px}
.fallback strong{color:#fff}
.fallback a{color:#ffc45e}
.vid-title{display:flex;gap:10px;align-items:flex-start;margin-block:14px 4px}
.vid-title input{font-size:18px;font-weight:700;border-color:transparent;background:transparent;padding:4px 8px;margin-left:-8px}
.vid-title input:not([readonly]):hover{border-color:var(--line)}
.vid-title input[readonly]{padding-left:0;margin-left:0}
.meta-grid{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 10px;align-items:center;margin-top:6px}
.meta-grid label{font-size:13px;color:var(--muted)}
.meta-grid input{padding:6px 10px}
.vid-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.confirm-box{margin-top:12px;border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);background:var(--danger-bg);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.confirm-box strong{color:var(--danger)}
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.quick #quick-note{flex:1 1 200px;min-width:0;width:auto}
.quick #quick-name{flex:0 1 130px;width:130px}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 140px);min-width:0}
@media (max-width:860px){.rail{max-height:none}}
.rail-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.marks{list-style:none;margin:0;padding:6px;overflow:auto}
.mark{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 8px;border-radius:8px}
.mark.active{background:var(--active);box-shadow:inset 3px 0 0 var(--accent)}
.mark .note{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:1px}
.mark .by{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.mark .acts{display:flex;gap:2px;opacity:.55}
.mark:hover .acts,.mark:focus-within .acts{opacity:1}
.mark.editing{grid-template-columns:minmax(0,1fr)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Search */
.search-box{margin-bottom:18px}
.search-box input{font-size:17px;padding:12px 14px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.result-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.result-head button{background:none;border:0;padding:0;font-weight:700;font-size:16px;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.result-head button:hover{text-decoration:underline}
.hit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:none;border:0;text-align:left;padding:6px 4px;border-radius:6px;cursor:pointer}
.hit:hover{background:var(--surface-2)}
.hit .note{white-space:pre-wrap;overflow-wrap:anywhere}

/* Add */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;max-width:760px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:14px}
.req{color:var(--danger)}
.hint{font-size:13px;color:var(--muted)}
.hint.ok{color:var(--tc-fg)}
.hint.err{color:var(--danger)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.entry{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:8px;align-items:start}
@media (max-width:520px){.entry{grid-template-columns:96px minmax(0,1fr) auto}.tcin{width:96px!important}}
.entry textarea{min-height:42px}
.add-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.panel input[readonly]{background:var(--surface-2);border-color:var(--line);padding-left:12px;color:var(--fg);cursor:default}
.panel input[readonly]:focus{box-shadow:none;border-color:var(--line)}
.lock{font-size:12px;color:var(--muted);font-weight:400}
details.panel summary{cursor:pointer;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:50;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand"><span class="tc">▶ 00:00</span>影片時間碼筆記</div>
    <div class="bar-right">
      <nav aria-label="主選單">
        <button data-nav="library" id="nav-library">影片庫</button>
        <button data-nav="search" id="nav-search">搜尋備註</button>
        <button data-nav="add" id="nav-add">新增紀錄</button>
      </nav>
      <div class="auth" id="auth-area" hidden></div>
    </div>
  </div>
  <div class="banner" id="mode-banner" hidden><div class="wrap" id="mode-banner-text"></div></div>
</header>

<main class="wrap">
  <!-- 影片庫 -->
  <section id="view-library" hidden>
    <div class="lib-head">
      <div><h1>影片庫</h1><div class="muted small" id="lib-stats"></div></div>
      <button class="btn primary" data-nav="add">＋ 新增紀錄</button>
    </div>
    <div class="tagbar" id="tagbar"></div>
    <div class="grid" id="lib-grid"></div>
  </section>

  <!-- 單一影片 -->
  <section id="view-video" hidden>
    <button class="btn ghost" id="back-btn">← 返回</button>
    <div class="vid-layout">
      <div style="min-width:0">
        <div class="player-box" id="player-box">
          <div id="yt-player"></div>
          <div class="fallback" id="player-fallback" hidden></div>
        </div>
        <div class="vid-title">
          <input type="text" id="title-input" aria-label="影片標題" placeholder="未命名影片">
          <span class="chip" id="sample-chip" hidden>範例</span>
        </div>
        <div class="meta-grid">
          <label for="channel-input">頻道</label>
          <input type="text" id="channel-input" placeholder="頻道名稱">
          <label for="tags-input">Hashtag</label>
          <input type="text" id="tags-input" placeholder="#演唱會 #必看（用空白分開）">
        </div>
        <div class="vid-actions">
          <a class="small muted" id="yt-link" href="#" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a>
          <button class="btn danger-outline sm" id="del-video" hidden>🗑 刪除這部影片</button>
        </div>
        <div class="confirm-box" id="del-confirm" hidden>
          <div><strong>確定要刪除這部影片嗎？</strong></div>
          <div class="small" id="del-confirm-text"></div>
          <div class="row">
            <button class="btn danger-solid sm" id="del-video-yes">刪除影片與所有時間點</button>
            <button class="btn sm" id="del-video-no">取消</button>
          </div>
        </div>
        <form class="quick" id="quick-form">
          <button type="button" class="btn" id="grab-time" title="把目前播放位置填入時間碼">⏱ 記下目前時間</button>
          <input type="text" class="tcin" id="quick-time" placeholder="1:23" aria-label="時間碼">
          <input type="text" id="quick-note" placeholder="可看點備註…" aria-label="備註">
          <input type="text" id="quick-name" placeholder="你的名字" aria-label="建立者名字">
          <button class="btn primary" type="submit">新增</button>
        </form>
      </div>
      <aside class="rail">
        <div class="rail-head"><h2>時間點</h2><span class="muted small" id="mark-count"></span></div>
        <ul class="marks" id="mark-list"></ul>
      </aside>
    </div>
  </section>

  <!-- 搜尋 -->
  <section id="view-search" hidden>
    <h1 style="margin-bottom:14px">搜尋備註</h1>
    <div class="search-box">
      <input type="search" id="search-input" placeholder="輸入關鍵字，例如：副歌、經典台詞、#演唱會、建立者名字…" autocomplete="off">
    </div>
    <div class="muted small" id="search-summary" style="margin-bottom:12px"></div>
    <div class="stack" id="search-results"></div>
  </section>

  <!-- 新增 -->
  <section id="view-add" hidden>
    <h1 style="margin-bottom:16px">新增紀錄</h1>
    <div class="add-cols">
      <form class="panel" id="add-form" novalidate>
        <div class="field">
          <label for="add-author">你的名字 <span class="req">*</span></label>
          <input type="text" id="add-author" placeholder="會顯示在你新增的每個時間點旁邊" maxlength="40">
        </div>
        <div class="field">
          <label for="add-url">YouTube 影片網址 <span class="req">*</span></label>
          <input type="text" id="add-url" placeholder="https://www.youtube.com/watch?v=… 或 https://youtu.be/…" autocomplete="off">
          <div class="hint" id="url-hint"></div>
        </div>
        <div class="field">
          <label for="add-title">影片標題 <span class="lock" id="title-lock">🔒 貼上網址後自動帶入</span></label>
          <input type="text" id="add-title" placeholder="貼上網址後自動帶入" maxlength="200" readonly>
        </div>
        <div class="two">
          <div class="field">
            <label for="add-channel">頻道名稱 <span class="lock" id="channel-lock">🔒 自動帶入</span></label>
            <input type="text" id="add-channel" placeholder="貼上網址後自動帶入" maxlength="100" readonly>
          </div>
          <div class="field">
            <label for="add-tags">Hashtag <span class="muted small">（選填）</span></label>
            <input type="text" id="add-tags" placeholder="#演唱會 #現場">
          </div>
        </div>
        <div class="field">
          <label>時間碼與可看點 <span class="req">*</span></label>
          <div class="hint">時間可輸入 1:23、01:02:03、83（秒）或 1m23s。</div>
          <div class="stack" id="entries" style="gap:8px"></div>
          <div><button type="button" class="btn" id="add-entry">＋ 再加一筆時間點</button></div>
        </div>
        <div class="row">
          <button class="btn primary" type="submit" id="add-submit">儲存紀錄</button>
          <span class="hint err" id="form-err"></span>
        </div>
      </form>

      <details class="panel" id="backup">
        <summary>備份與還原</summary>
        <div class="hint" id="backup-hint"></div>
        <div class="row"><button type="button" class="btn" id="export-btn">產生備份資料</button><button type="button" class="btn" id="copy-btn" hidden>複製</button></div>
        <textarea id="export-box" readonly hidden rows="6" style="font-family:var(--f-mono);font-size:12px"></textarea>
        <div class="field" id="import-area">
          <label for="import-box">還原：貼上備份資料</label>
          <textarea id="import-box" rows="4" style="font-family:var(--f-mono);font-size:12px" placeholder='{"videos":[…]}'></textarea>
          <div class="row"><button type="button" class="btn" id="import-btn">合併匯入</button><input type="file" id="import-file" accept=".json,application/json" class="small"><span class="hint" id="import-hint"></span></div>
        </div>
      </details>
    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script type="module">
/* =====================================================================
   設定區：把 Firebase 專案的設定貼在這裡
   - FIREBASE_CONFIG 留空時，網站會以「單機模式」運作（資料只存在自己的瀏覽器）
   - ADMIN_EMAILS：可以刪除、修改資料的管理者 Google 帳號
     （真正的權限控管在 Firestore 安全規則，這裡只決定是否顯示管理按鈕）
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDfoeOlwbrBioM4eBTujmLxL2H8uIoE3P4",
  authDomain: "ytplusdb.firebaseapp.com",
  projectId: "ytplusdb",
  storageBucket: "ytplusdb.firebasestorage.app",
  messagingSenderId: "859009825230",
  appId: "1:859009825230:web:2eeeb1663b0ba61db7539f"
};
const ADMIN_EMAILS = ['osht9478@gmail.com', 'su3cj3x04@gmail.com'];
/* ===================================================================== */

const FB_VER = '10.12.2';
const CLOUD = !!FIREBASE_CONFIG.projectId;
const LOCAL_KEY = 'yt-timecode-notes.v1';
const NAME_KEY = 'yt-timecode-notes.name';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };

/* ---------- 共用狀態 ---------- */
let db = { videos: [] };          // 畫面用的資料：videos[{id,title,channel,tags,updatedAt,sample,marks:[{id,t,note,author}]}]
let loaded = false;
let user = null;                  // Firebase 登入者
const isAdmin = () => !CLOUD || (!!user && ADMIN_EMAILS.map(e => e.toLowerCase()).includes((user.email||'').toLowerCase()));
const getVideo = id => db.videos.find(v => v.id === id);
const sortMarks = v => v.marks.sort((a,b) => a.t - b.t);

/* =====================================================================
   資料層：store 提供相同的介面，單機模式用 localStorage，雲端模式用 Firestore
   ===================================================================== */
let store;

  return { videos: [
    { id:'dQw4w9WgXcQ', title:'Rick Astley - Never Gonna Give You Up', channel:'Rick Astley', tags:['MV','80年代','經典'], sample:true, updatedAt:now,
      marks:[
        {id:uid(), t:0,  note:'開場鼓點，經典前奏', author:'範例'},
        {id:uid(), t:43, note:'第一次副歌，招牌舞步', author:'範例'},
        {id:uid(), t:85, note:'第二段主歌，背景舞者走位', author:'範例'},
        {id:uid(), t:162,note:'橋段之後的副歌高潮', author:'範例'}
      ]},
    { id:'jNQXAC9IVRw', title:'Me at the zoo', channel:'jawed', tags:['經典','YouTube歷史'], sample:true, updatedAt:now-1000,
      marks:[
        {id:uid(), t:0, note:'YouTube 第一支影片的開頭', author:'範例'},
        {id:uid(), t:5, note:'大象的長鼻子，經典台詞', author:'範例'}
      ]}
  ]};

function makeLocalStore(){
  let data;
  try { const s = lsGet(LOCAL_KEY); data = s ? JSON.parse(s) : null; } catch(e){ data = null; }
  if (!data || !Array.isArray(data.videos)) data = seed();
  data.videos.forEach(v => { v.tags = v.tags || []; v.channel = v.channel || ''; v.marks.forEach(m => m.author = m.author || ''); });
  const persist = () => { lsSet(LOCAL_KEY, JSON.stringify(data)); db = data; onData(); };
  const vid = id => data.videos.find(v => v.id === id);
  return {
    start(){ db = data; loaded = true; onData(); },
    async saveRecord({id, title, channel, tags, marks, author}){
      let v = vid(id);
      if (!v) { v = { id, title, channel, tags, marks:[], updatedAt:Date.now() }; data.videos.push(v); }
      else { if (title) v.title = title; if (channel) v.channel = channel; v.tags = [...new Set([...(v.tags||[]), ...tags])]; }
      marks.forEach(m => v.marks.push({ id:uid(), t:m.t, note:m.note, author }));
      v.updatedAt = Date.now(); persist();
    },
    async addMark(videoId, t, note, author){ const v = vid(videoId); v.marks.push({id:uid(), t, note, author}); v.updatedAt = Date.now(); persist(); },
    async updateMark(videoId, markId, patch){ const m = vid(videoId).marks.find(x => x.id === markId); Object.assign(m, patch); persist(); },
    async deleteMark(videoId, markId){ const v = vid(videoId); v.marks = v.marks.filter(m => m.id !== markId); persist(); },
    async updateVideo(id, patch){ Object.assign(vid(id), patch); persist(); },
    async fillEmpty(id, patch){ const v = vid(id); let ch = false; for (const k in patch) if (!v[k] && patch[k]) { v[k] = patch[k]; ch = true; } if (ch) persist(); },
    async deleteVideo(id){ data.videos = data.videos.filter(v => v.id !== id); persist(); },
    async importData(d){ let n = 0; for (const nv of d.videos) { let v = vid(nv.id); if (!v) { v = {id:nv.id, title:nv.title||'', channel:nv.channel||'', tags:[], marks:[], updatedAt:Date.now()}; data.videos.push(v); }
        v.tags = [...new Set([...(v.tags||[]), ...(nv.tags||[])])];
        for (const m of nv.marks||[]) if (!v.marks.some(x => x.t === m.t && x.note === m.note)) { v.marks.push({id:uid(), t:m.t, note:String(m.note||''), author:String(m.author||'')}); n++; } }
      persist(); return n; }
  };
}

async function makeCloudStore(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')
  ]);
  const { getFirestore, collection, doc, onSnapshot, writeBatch, updateDoc, serverTimestamp, arrayUnion } = fs;
  const app = initializeApp(FIREBASE_CONFIG);
  const fdb = getFirestore(app);
  const auth = au.getAuth(app);
  const videosMap = new Map(), marksMap = new Map();
  let gotV = false, gotM = false;
  const ms = ts => ts && ts.toMillis ? ts.toMillis() : Date.now();
  function rebuild(){
    if (!gotV || !gotM) return;
    const vids = [];
    for (const [id, d] of videosMap) vids.push({ id, title:d.title||'', channel:d.channel||'', tags:d.tags||[], updatedAt:ms(d.updatedAt), marks:[] });
    const byId = new Map(vids.map(v => [v.id, v]));
    for (const [id, m] of marksMap) { const v = byId.get(m.videoId); if (v) v.marks.push({ id, t:m.t, note:m.note||'', author:m.author||'' }); }
    db = { videos: vids }; loaded = true; onData();
  }
  const onErr = e => { console.error(e); toast('讀取資料失敗：' + (e.code || e.message)); };

  au.onAuthStateChanged(auth, u => { user = u; renderAuth(); onData(); });
  window.__signIn = async () => { try { await au.signInWithPopup(auth, new au.GoogleAuthProvider()); if (!isAdmin()) toast('這個帳號不是管理者，只能新增紀錄'); } catch(e){ if (e.code !== 'auth/popup-closed-by-user') toast('登入失敗：' + (e.code || e.message)); } };
  window.__signOut = () => au.signOut(auth);

  const V = id => doc(fdb, 'videos', id);
  const M = id => doc(fdb, 'marks', id);
  return {
    start(){
      onSnapshot(collection(fdb, 'videos'), snap => { snap.docChanges().forEach(c => c.type === 'removed' ? videosMap.delete(c.doc.id) : videosMap.set(c.doc.id, c.doc.data({serverTimestamps:'estimate'}))); gotV = true; rebuild(); }, onErr);
      onSnapshot(collection(fdb, 'marks'),  snap => { snap.docChanges().forEach(c => c.type === 'removed' ? marksMap.delete(c.doc.id) : marksMap.set(c.doc.id, c.doc.data())); gotM = true; rebuild(); }, onErr);
    },
    async saveRecord({id, title, channel, tags, marks, author}){
      const b = writeBatch(fdb);
      const old = videosMap.get(id);
      if (!old) {
        b.set(V(id), { title, channel, tags, createdBy:author, createdAt:serverTimestamp(), updatedAt:serverTimestamp() });
      } else {
        const p = { updatedAt:serverTimestamp() };
        if (tags.length) p.tags = arrayUnion(...tags);
        if (title && (isAdmin() || !old.title)) p.title = title;
        if (channel && (isAdmin() || !old.channel)) p.channel = channel;
        b.update(V(id), p);
      }
      marks.forEach(m => b.set(doc(collection(fdb, 'marks')), { videoId:id, t:m.t, note:m.note, author, createdAt:serverTimestamp() }));
      await b.commit();
    },
    async addMark(videoId, t, note, author){
      const b = writeBatch(fdb);
      b.set(doc(collection(fdb, 'marks')), { videoId, t, note, author, createdAt:serverTimestamp() });
      b.update(V(videoId), { updatedAt:serverTimestamp() });
      await b.commit();
    },
    async updateMark(videoId, markId, patch){ await updateDoc(M(markId), patch); },
    async deleteMark(videoId, markId){ const b = writeBatch(fdb); b.delete(M(markId)); await b.commit(); },
    async updateVideo(id, patch){ await updateDoc(V(id), patch); },
    async fillEmpty(id, patch){ const old = videosMap.get(id); if (!old) return; const p = {}; for (const k in patch) if (!old[k] && patch[k]) p[k] = patch[k]; if (Object.keys(p).length) await updateDoc(V(id), p); },
    async deleteVideo(id){
      const ids = [...marksMap].filter(([,m]) => m.videoId === id).map(([k]) => k);
      for (let i = 0; i < ids.length; i += 450) { const b = writeBatch(fdb); ids.slice(i, i+450).forEach(k => b.delete(M(k))); await b.commit(); }
      const b = writeBatch(fdb); b.delete(V(id)); await b.commit();
    },
    async importData(d){
      let n = 0, b = writeBatch(fdb), ops = 0;
      const flush = async () => { if (ops) { await b.commit(); b = writeBatch(fdb); ops = 0; } };
      for (const nv of d.videos) {
        if (!videosMap.has(nv.id)) { b.set(V(nv.id), { title:nv.title||'', channel:nv.channel||'', tags:nv.tags||[], createdBy:'匯入', createdAt:serverTimestamp(), updatedAt:serverTimestamp() }); ops++; }
        else if ((nv.tags||[]).length) { b.update(V(nv.id), { tags:arrayUnion(...nv.tags) }); ops++; }
        const existing = [...marksMap.values()].filter(m => m.videoId === nv.id);
        for (const m of nv.marks||[]) {
          if (existing.some(x => x.t === m.t && x.note === m.note)) continue;
          b.set(doc(collection(fdb, 'marks')), { videoId:nv.id, t:m.t, note:String(m.note||''), author:String(m.author||'匯入').slice(0,40) || '匯入', createdAt:serverTimestamp() }); ops++; n++;
          if (ops >= 400) await flush();
        }
        if (ops >= 400) await flush();
      }
      await flush(); return n;
    }
  };
}

async function run(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){ console.error(e); toast(e && e.code === 'permission-denied' ? '沒有權限執行這個動作' : '儲存失敗：' + (e.code || e.message)); return false; }
}

/* ---------- 解析 ---------- */
function parseVideoId(s){
  s = String(s||'').trim(); if (!s) return null;
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s);
    const h = u.hostname.replace(/^(www|m|music)\./,'');
    if (h === 'youtu.be') { const id = u.pathname.slice(1).split('/')[0]; return /^[\w-]{11}$/.test(id) ? id : null; }
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(h)) {
      const v = u.searchParams.get('v'); if (v && /^[\w-]{11}$/.test(v)) return v;
      const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([\w-]{11})/); if (m) return m[1];
    }
  } catch(e){}
  return null;
}
function parseUrlTime(s){
  try { const u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); const t = u.searchParams.get('t') || u.searchParams.get('start'); return t ? parseTime(t) : null; } catch(e){ return null; }
}
function parseTime(s){
  s = String(s||'').trim().toLowerCase().replace(/\s+/g,''); if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return Math.floor(+s);
  const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  if (m && (m[1]||m[2]||m[3])) return (+m[1]||0)*3600 + (+m[2]||0)*60 + (+m[3]||0);
  const p = s.split(/[:：]/);
  if (p.length >= 2 && p.length <= 3 && p.every(x => /^\d+$/.test(x))) return p.reduce((a,x) => a*60 + +x, 0);
  return null;
}
function fmt(t){
  t = Math.max(0, Math.floor(t)); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  const ss = String(s).padStart(2,'0');
  return h ? `${h}:${String(m).padStart(2,'0')}:${ss}` : `${m}:${ss}`;
}
function parseTags(s){ const out=[]; for (const t of String(s||'').split(/[\s,，、#＃]+/)) { const x=t.trim().slice(0,40); if (x && !out.includes(x)) out.push(x); } return out.slice(0,30); }
const tagStr = a => (a||[]).map(t => '#'+t).join(' ');
const watchUrl = (id,t) => `https://www.youtube.com/watch?v=${id}` + (t ? `&t=${t}s` : '');

/* ---------- 名字 ---------- */
function getName(){ return (lsGet(NAME_KEY) || '').trim(); }
$('#add-author').addEventListener('change', e => { const n = e.target.value.trim(); if (n) setName(n); });
$('#quick-name').addEventListener('change', e => { const n = e.target.value.trim(); if (n) setName(n); });
function setName(n){ n = n.trim().slice(0,40); if (n) lsSet(NAME_KEY, n); $('#add-author').value = n; $('#quick-name').value = n; }

/* ---------- 登入區、模式提示 ---------- */
function renderAuth(){
  const a = $('#auth-area');
  if (!CLOUD) { a.hidden = true; return; }
  a.hidden = false;
  if (user) a.innerHTML = `${isAdmin() ? '<span class="admin-badge">管理者</span>' : ''}<span class="muted">${esc(user.displayName || user.email)}</span><button class="btn ghost sm" id="signout-btn">登出</button>`;
  else a.innerHTML = `<button class="btn ghost sm" id="signin-btn">管理者登入</button>`;
}
$('#auth-area').addEventListener('click', e => {
  if (e.target.closest('#signin-btn')) window.__signIn && window.__signIn();
  if (e.target.closest('#signout-btn')) window.__signOut && window.__signOut();
});
function renderModeBanner(){
  const b = $('#mode-banner');
  if (!CLOUD) { b.hidden = false; $('#mode-banner-text').textContent = '目前是單機模式：紀錄只存在這台裝置的瀏覽器，其他人看不到。設定 Firebase 後就能多人共用。'; }
  $('#backup-hint').textContent = CLOUD ? '「產生備份資料」會匯出目前所有人的紀錄。還原（匯入）只有管理者能使用。' : '紀錄存在這個瀏覽器裡。換電腦或清除瀏覽資料前，先把資料複製起來保存。';
}

/* ---------- 資料更新時重畫 ---------- */
function onData(){
  if (view === 'library') renderLibrary();
  else if (view === 'search') renderSearch();
  else if (view === 'video') {
    if (!getVideo(currentId)) { if (loaded) { toast('這部影片已被刪除'); show('library'); } return; }
    renderVideoMeta(); if (!editingId) renderMarks();
  }
  $('#import-area').hidden = !isAdmin();
}

/* ---------- 導覽 ---------- */
let view = 'library', currentId = null, prevView = 'library';
function show(name){
  view = name;
  for (const v of ['library','video','search','add']) $('#view-'+v).hidden = v !== name;
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.nav === name || (name==='video' && b.dataset.nav==='library') ? 'page' : 'false'));
  if (name !== 'video') { try { player && player.pauseVideo && player.pauseVideo(); } catch(e){} }
  if (name === 'library') renderLibrary();
  if (name === 'search') { renderSearch(); setTimeout(() => $('#search-input').focus(), 0); }
  if (name === 'add') { if (!$('#entries').children.length) addEntryRow(); resetUrlHint(); }
  window.scrollTo(0,0);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (b) show(b.dataset.nav); });
$('#back-btn').onclick = () => show(prevView === 'video' ? 'library' : prevView);

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

/* ---------- 影片庫 ---------- */
let tagFilter = null;
function renderLibrary(){
  const g = $('#lib-grid');
  if (!loaded) { $('#tagbar').hidden = true; $('#lib-stats').textContent = ''; g.innerHTML = `<div class="empty" style="grid-column:1/-1">載入中…</div>`; return; }
  const allTags = {}; db.videos.forEach(v => (v.tags||[]).forEach(t => allTags[t] = (allTags[t]||0) + 1));
  if (tagFilter && !allTags[tagFilter]) tagFilter = null;
  const names = Object.keys(allTags).sort((a,b) => allTags[b]-allTags[a] || a.localeCompare(b));
  $('#tagbar').hidden = !names.length;
  $('#tagbar').innerHTML = names.length ? `<span class="label">篩選</span><button class="tag" data-filter="" aria-pressed="${!tagFilter}">全部</button>` + names.map(t => `<button class="tag" data-filter="${esc(t)}" aria-pressed="${tagFilter===t}">#${esc(t)} <span class="muted">${allTags[t]}</span></button>`).join('') : '';
  const vids = [...db.videos].filter(v => !tagFilter || (v.tags||[]).includes(tagFilter)).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  const total = vids.reduce((n,v) => n + v.marks.length, 0);
  $('#lib-stats').textContent = vids.length ? (tagFilter ? `#${tagFilter}：` : '') + `${vids.length} 部影片 · ${total} 個時間點` : '';
  if (!vids.length) { g.innerHTML = `<div class="empty" style="grid-column:1/-1">還沒有任何紀錄。按「新增紀錄」貼上第一支 YouTube 影片網址。</div>`; return; }
  g.innerHTML = vids.map(v => {
    sortMarks(v);
    const peek = v.marks.slice(0,2).map(m => `<div class="peek"><span class="tc-chip">${fmt(m.t)}</span><span>${esc(m.note)}</span></div>`).join('');
    return `<button class="card" data-open="${v.id}">
      <div class="thumb"><span class="ph">${v.id}</span><img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.remove()"><span class="count">${v.marks.length} 個時間點</span></div>
      <div class="card-body"><div class="row" style="gap:8px"><span class="card-title">${esc(v.title || '未命名影片')}</span>${v.sample?'<span class="chip">範例</span>':''}</div>${v.channel?`<div class="channel">${esc(v.channel)}</div>`:''}${(v.tags||[]).length?`<div class="tags">${v.tags.map(t=>`<span class="tag" data-filter="${esc(t)}">#${esc(t)}</span>`).join('')}</div>`:''}${peek}</div>
    </button>`;
  }).join('');
}
$('#tagbar').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) { tagFilter = b.dataset.filter || null; renderLibrary(); } });
$('#lib-grid').addEventListener('click', e => {
  const tg = e.target.closest('[data-filter]'); if (tg) { e.stopPropagation(); tagFilter = tg.dataset.filter; renderLibrary(); return; }
  const c = e.target.closest('[data-open]'); if (c) openVideo(c.dataset.open);
});

/* ---------- 單一影片 ---------- */
let editingId = null, confirmId = null;
function openVideo(id, t){
  if (view !== 'video') prevView = view;
  currentId = id; editingId = null; confirmId = null;
  const v = getVideo(id); if (!v) return show('library');
  show('video');
  $('#del-confirm').hidden = true;
  $('#quick-time').value = ''; $('#quick-note').value = ''; $('#quick-name').value = getName();
  renderVideoMeta(true);
  renderMarks();
  loadInPlayer(id, t);
}
function renderVideoMeta(force){
  const v = getVideo(currentId); if (!v) return;
  const admin = isAdmin();
  for (const [sel, val] of [['#title-input', v.title || ''], ['#channel-input', v.channel || ''], ['#tags-input', tagStr(v.tags)]]) {
    const el = $(sel); el.readOnly = !admin;
    if (force || document.activeElement !== el) el.value = val;
  }
  $('#channel-input').placeholder = admin ? '頻道名稱' : '—';
  $('#tags-input').placeholder = admin ? '#演唱會 #必看（用空白分開）' : '—';
  $('#sample-chip').hidden = !v.sample;
  $('#yt-link').href = watchUrl(v.id);
  $('#del-video').hidden = !admin;
  if (!admin) $('#del-confirm').hidden = true;
  $('#del-confirm-text').textContent = `「${v.title || '未命名影片'}」和它的 ${v.marks.length} 個時間點（包含其他人新增的）都會被刪除${CLOUD ? '，所有人都看不到' : ''}，而且無法復原。`;
}
function renderMarks(){
  const v = getVideo(currentId); if (!v) return;
  sortMarks(v);
  const admin = isAdmin();
  $('#mark-count').textContent = `${v.marks.length} 筆`;
  const ul = $('#mark-list');
  if (!v.marks.length) { ul.innerHTML = `<li class="empty">還沒有時間點。播放影片，按「記下目前時間」開始記錄。</li>`; return; }
  ul.innerHTML = v.marks.map(m => {
    if (m.id === editingId && admin) return `<li class="mark editing" data-id="${m.id}"><form class="stack" style="gap:8px" data-edit="${m.id}">
        <input type="text" class="tcin" id="edit-t-${m.id}" value="${fmt(m.t)}" aria-label="時間碼">
        <textarea id="edit-n-${m.id}" aria-label="備註">${esc(m.note)}</textarea>
        <div class="row"><button class="btn primary" type="submit">儲存</button><button class="btn" type="button" data-cancel>取消</button></div></form></li>`;
    const acts = admin ? `<div class="acts"><button class="btn ghost small" data-edit-btn="${m.id}">編輯</button>${confirmId === m.id ? `<button class="btn ghost danger small" data-del="${m.id}">確定刪除？</button>` : `<button class="btn ghost small" data-askdel="${m.id}">刪除</button>`}</div>` : '<span></span>';
    return `<li class="mark" data-id="${m.id}">
      <a class="tc-chip" href="${watchUrl(v.id, m.t)}" target="_blank" rel="noopener" data-seek="${m.t}">${fmt(m.t)}</a>
      <div class="note">${esc(m.note) || '<span class="muted">（無備註）</span>'}${m.author ? `<span class="by">— ${esc(m.author)}</span>` : ''}</div>
      ${acts}</li>`;
  }).join('');
  lastActive = undefined; highlightActive(true);
}
$('#mark-list').addEventListener('click', async e => {
  const s = e.target.closest('[data-seek]');
  if (s && playerReady) { e.preventDefault(); seek(+s.dataset.seek); return; }
  const ed = e.target.closest('[data-edit-btn]'); if (ed) { editingId = ed.dataset.editBtn; confirmId = null; renderMarks(); const ta = document.getElementById('edit-n-'+editingId); ta && ta.focus(); return; }
  if (e.target.closest('[data-cancel]')) { editingId = null; renderMarks(); return; }
  const ask = e.target.closest('[data-askdel]'); if (ask) { confirmId = ask.dataset.askdel; renderMarks(); return; }
  const del = e.target.closest('[data-del]'); if (del) { confirmId = null; await run(() => store.deleteMark(currentId, del.dataset.del), '已刪除'); }
});
$('#mark-list').addEventListener('submit', async e => {
  e.preventDefault(); const id = e.target.dataset.edit;
  const t = parseTime(document.getElementById('edit-t-'+id).value);
  if (t === null) { toast('時間格式看不懂，例：1:23'); return; }
  const note = document.getElementById('edit-n-'+id).value.trim().slice(0,2000);
  editingId = null;
  if (await run(() => store.updateMark(currentId, id, { t, note }), '已更新')) renderMarks();
});
$('#title-input').addEventListener('change', e => { if (isAdmin()) run(() => store.updateVideo(currentId, { title: e.target.value.trim().slice(0,200) }), '已更新標題'); });
$('#channel-input').addEventListener('change', e => { if (isAdmin()) run(() => store.updateVideo(currentId, { channel: e.target.value.trim().slice(0,100) }), '已更新頻道'); });
$('#tags-input').addEventListener('change', e => { if (isAdmin()) { const tags = parseTags(e.target.value); e.target.value = tagStr(tags); run(() => store.updateVideo(currentId, { tags }), '已更新 Hashtag'); } });

/* 刪除影片 */
$('#del-video').onclick = () => { $('#del-confirm').hidden = false; $('#del-video-no').focus(); };
$('#del-video-no').onclick = () => { $('#del-confirm').hidden = true; };
$('#del-video-yes').onclick = async () => {
  const btn = $('#del-video-yes'); btn.disabled = true; btn.textContent = '刪除中…';
  const id = currentId;
  const ok = await run(() => store.deleteVideo(id), '已刪除影片');
  btn.disabled = false; btn.textContent = '刪除影片與所有時間點';
  if (ok) { currentId = null; show('library'); }
};

$('#grab-time').onclick = () => {
  if (!playerReady) { toast('播放器還沒準備好'); return; }
  $('#quick-time').value = fmt(player.getCurrentTime()); $('#quick-note').focus();
};
$('#quick-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#quick-name').value.trim();
  if (!name) { toast('請填上你的名字'); $('#quick-name').focus(); return; }
  let tStr = $('#quick-time').value; if (!tStr.trim() && playerReady) tStr = String(Math.floor(player.getCurrentTime()));
  const t = parseTime(tStr); if (t === null) { toast('請輸入時間，例：1:23'); return; }
  setName(name);
  const note = $('#quick-note').value.trim().slice(0,2000);
  if (await run(() => store.addMark(currentId, t, note, name), `已新增 ${fmt(t)}`)) { $('#quick-time').value = ''; $('#quick-note').value = ''; }
});

/* ---------- YouTube 播放器 ---------- */
let player = null, playerReady = false, playerVid = null, ytState = 'loading', pending = null;
window.onYouTubeIframeAPIReady = () => { ytState = 'ready'; if (pending) { const p = pending; pending = null; loadInPlayer(p.id, p.t); } };
(function loadApi(){
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { ytState = 'failed'; showFallback(); };
  document.head.appendChild(s);
  setTimeout(() => { if (ytState === 'loading') { ytState = 'failed'; showFallback(); } }, 8000);
})();
function showFallback(){
  if (!currentId) return;
  const fb = $('#player-fallback'); fb.hidden = false;
  fb.innerHTML = ytState === 'failed'
    ? `<strong>無法載入 YouTube 播放器</strong><span>請確認網路連線，或直接在 YouTube 觀看。點時間碼會在 YouTube 新分頁開啟對應時間。</span><a href="${watchUrl(currentId)}" target="_blank" rel="noopener">在 YouTube 開啟這部影片 ↗</a>`
    : `<span>播放器載入中…</span>`;
}
function loadInPlayer(id, t){
  playerReady = playerReady && playerVid === id;
  if (ytState !== 'ready') { pending = {id, t}; showFallback(); return; }
  $('#player-fallback').hidden = true;
  if (player && playerVid === id && playerReady) { if (t != null) seek(t); return; }
  if (player && player.loadVideoById) {
    playerVid = id; playerReady = false;
    if (t != null) player.loadVideoById({videoId:id, startSeconds:t}); else player.cueVideoById(id);
    return;
  }
  playerVid = id;
  player = new YT.Player('yt-player', {
    videoId:id,
    playerVars:{ start: t || 0, autoplay: t != null ? 1 : 0, rel:0, playsinline:1 },
    events:{
      onReady: () => { playerReady = true; },
      onStateChange: () => { playerReady = true; autoFillMeta(); },
      onError: () => { toast('這支影片無法內嵌播放，請改用 YouTube 開啟'); }
    }
  });
}
function autoFillMeta(){
  try {
    const d = player.getVideoData && player.getVideoData(); if (!d || d.video_id !== playerVid) return;
    const v = getVideo(playerVid); if (!v) return;
    const patch = {};
    if (!v.title && d.title) patch.title = d.title.slice(0,200);
    if (!v.channel && d.author) patch.channel = d.author.slice(0,100);
    if (Object.keys(patch).length) store.fillEmpty(playerVid, patch).catch(() => {});
  } catch(e){}
}
function seek(t){
  try { player.seekTo(t, true); player.playVideo(); } catch(e){}
  const box = $('#player-box').getBoundingClientRect();
  if (box.top < 0 || box.top > window.innerHeight * 0.6) $('#player-box').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
  setTimeout(() => highlightActive(true), 300);
}
let lastActive;
function highlightActive(force){
  if (view !== 'video' || !playerReady || !player || !player.getCurrentTime) return;
  const cur = player.getCurrentTime(); const v = getVideo(currentId); if (!v) return;
  let act = null; for (const m of v.marks) if (m.t <= cur + 0.5) act = m.id;
  if (act === lastActive && !force) return; lastActive = act;
  document.querySelectorAll('#mark-list .mark').forEach(li => li.classList.toggle('active', li.dataset.id === act));
}
setInterval(() => highlightActive(false), 500);

/* ---------- 搜尋 ---------- */
let searchTimer;
$('#search-input').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(renderSearch, 120); });
function hl(text, terms){
  let s = esc(text); if (!terms.length) return s;
  const re = new RegExp('(' + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')', 'gi');
  return s.replace(re, '<mark>$1</mark>');
}
function renderSearch(){
  const q = $('#search-input').value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  const out = $('#search-results'), sum = $('#search-summary');
  if (!terms.length) { sum.textContent = '輸入關鍵字會同時比對備註、影片標題、頻道、Hashtag 和建立者；多個關鍵字用空白分開。'; out.innerHTML = ''; return; }
  const groups = [];
  for (const v of db.videos) {
    sortMarks(v);
    const vtext = [v.title, v.channel, ...(v.tags||[]).map(t => '#'+t)].join(' ').toLowerCase();
    const videoHit = terms.every(t => vtext.includes(t));
    const markHits = v.marks.filter(m => { const mt = ((m.note||'') + ' ' + (m.author||'')).toLowerCase(); return terms.some(t => mt.includes(t)) && terms.every(t => (mt + ' ' + vtext).includes(t)); });
    const list = markHits.length ? markHits : (videoHit ? v.marks : []);
    if (list.length || videoHit) groups.push({v, list});
  }
  const n = groups.reduce((a,g) => a + g.list.length, 0);
  sum.textContent = groups.length ? `找到 ${groups.length} 部影片、${n} 個時間點` : `找不到含「${q}」的紀錄。`;
  out.innerHTML = groups.map(({v, list}) => `<div class="result">
      <div class="result-head"><button data-open="${v.id}">${hl(v.title || '未命名影片', terms)}</button><span class="muted small">共 ${v.marks.length} 個時間點</span></div>
      ${(v.channel||(v.tags||[]).length)?`<div class="row small" style="gap:8px">${v.channel?`<span class="channel">${hl(v.channel,terms)}</span>`:''}${(v.tags||[]).map(t=>`<span class="tag">${hl('#'+t,terms)}</span>`).join('')}</div>`:''}
      ${list.map(m => `<button class="hit" data-open="${v.id}" data-t="${m.t}"><span class="tc-chip">${fmt(m.t)}</span><span class="note">${hl(m.note, terms)}${m.author?` <span class="muted small">— ${hl(m.author, terms)}</span>`:''}</span></button>`).join('')}
    </div>`).join('');
}
$('#search-results').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openVideo(b.dataset.open, b.dataset.t != null ? +b.dataset.t : undefined); });

/* ---------- 新增 ---------- */
let rowN = 0;
const URL_HINT = '支援一般網址、youtu.be 短網址、Shorts；網址裡帶的 t= 時間會自動帶入。';
function resetUrlHint(){ if (!$('#add-url').value.trim()) { $('#url-hint').className = 'hint'; $('#url-hint').textContent = URL_HINT; } }
function addEntryRow(){
  const i = ++rowN; const div = document.createElement('div'); div.className = 'entry';
  div.innerHTML = `<input type="text" class="tcin" id="e-t-${i}" placeholder="1:23" aria-label="時間碼">
    <textarea id="e-n-${i}" rows="1" placeholder="這段的可看點…" aria-label="備註" maxlength="2000"></textarea>
    <button type="button" class="btn ghost" aria-label="移除這一筆" data-rm>✕</button>`;
  $('#entries').appendChild(div); return div;
}
$('#add-entry').onclick = () => addEntryRow().querySelector('input').focus();
$('#entries').addEventListener('click', e => { if (e.target.closest('[data-rm]')) { const r = e.target.closest('.entry'); if ($('#entries').children.length > 1) r.remove(); else { r.querySelector('input').value=''; r.querySelector('textarea').value=''; } } });
/* 自動抓取影片標題與頻道 */
const metaCache = new Map();
async function fetchMeta(id){
  if (metaCache.has(id)) return metaCache.get(id);
  const url = 'https://www.youtube.com/watch?v=' + id;
  let meta = null;
  for (const ep of ['https://noembed.com/embed?url=', 'https://www.youtube.com/oembed?format=json&url=']) {
    try {
      const r = await fetch(ep + encodeURIComponent(url));
      if (r.ok) { const d = await r.json(); if (d && d.title && !d.error) { meta = { title:d.title, channel:d.author_name || '' }; break; } }
    } catch(e){}
  }
  if (!meta) meta = await metaFromPlayer(id);
  if (meta) metaCache.set(id, meta);
  return meta;
}
function metaFromPlayer(id){
  return new Promise(res => {
    if (ytState !== 'ready') return res(null);
    const wrap = document.createElement('div'); wrap.style.cssText = 'position:absolute;left:-9999px;top:0;width:200px;height:120px;overflow:hidden';
    const host = document.createElement('div'); wrap.appendChild(host); document.body.appendChild(wrap);
    let done = false, p;
    const finish = v => { if (done) return; done = true; try { p && p.destroy(); } catch(e){} wrap.remove(); res(v); };
    const read = t => { try { const d = t.getVideoData(); if (d && d.title) finish({ title:d.title, channel:d.author || '' }); } catch(e){} };
    p = new YT.Player(host, { videoId:id, playerVars:{ mute:1, autoplay:1, playsinline:1 }, events:{
      onReady: e => { e.target.mute(); read(e.target); if (!done) e.target.playVideo(); },
      onStateChange: e => read(e.target),
      onError: () => finish(null) } });
    setTimeout(() => finish(null), 10000);
  });
}
function setMetaFields(title, channel, locked, ph){
  for (const [sel, val, lockSel] of [['#add-title', title, '#title-lock'], ['#add-channel', channel, '#channel-lock']]) {
    const el = $(sel); el.value = val || ''; el.readOnly = locked; el.placeholder = ph;
    $(lockSel).textContent = locked ? '🔒 自動帶入' : '（抓不到，請手動輸入）';
  }
}
let metaToken = 0, metaPending = null, urlTimer;
$('#add-url').addEventListener('input', () => { clearTimeout(urlTimer); urlTimer = setTimeout(onUrlChange, 250); });
function onUrlChange(){
  const val = $('#add-url').value, id = parseVideoId(val), h = $('#url-hint');
  const token = ++metaToken;
  if (!val.trim()) { resetUrlHint(); setMetaFields('', '', true, '貼上網址後自動帶入'); metaPending = null; return; }
  if (!id) { h.className = 'hint err'; h.textContent = '看不出這是哪支 YouTube 影片，請確認網址。'; setMetaFields('', '', true, '貼上網址後自動帶入'); metaPending = null; return; }
  const v = getVideo(id);
  h.className = 'hint ok'; h.textContent = v ? `已有這部影片（${v.marks.length} 筆），新的時間點會加進去。` : `影片 ID：${id}`;
  $('#add-tags').placeholder = v && v.tags && v.tags.length ? tagStr(v.tags) + '（可再加）' : '#演唱會 #現場';
  const t = parseUrlTime(val); const first = $('#entries .entry .tcin');
  if (t != null && first && !first.value) first.value = fmt(t);
  if (v && v.title && v.channel) { setMetaFields(v.title, v.channel, true, ''); metaPending = null; return; }
  setMetaFields(v ? v.title : '', v ? v.channel : '', true, '抓取中…');
  metaPending = fetchMeta(id).then(meta => {
    if (token !== metaToken) return;
    if (meta) setMetaFields((v && v.title) || meta.title, (v && v.channel) || meta.channel, true, '');
    else setMetaFields(v ? v.title : '', v ? v.channel : '', false, '抓不到影片資訊，請手動輸入');
  });
}
$('#add-form').addEventListener('submit', async e => {
  e.preventDefault(); const err = $('#form-err'); err.textContent = '';
  const author = $('#add-author').value.trim().slice(0,40);
  if (!author) { err.textContent = '請填上你的名字。'; $('#add-author').focus(); return; }
  const id = parseVideoId($('#add-url').value); if (!id) { err.textContent = '請貼上有效的 YouTube 網址。'; $('#add-url').focus(); return; }
  const marks = [];
  for (const r of $('#entries').querySelectorAll('.entry')) {
    const ts = r.querySelector('input').value, note = r.querySelector('textarea').value.trim().slice(0,2000);
    if (!ts.trim() && !note) continue;
    const t = parseTime(ts); if (t === null) { err.textContent = `「${ts || '(空白)'}」不是有效的時間，例：1:23`; r.querySelector('input').focus(); return; }
    marks.push({ t, note });
  }
  if (!marks.length) { err.textContent = '至少填一筆時間點。'; return; }
  const btn = $('#add-submit'); btn.disabled = true; btn.textContent = '儲存中…';
  if (metaPending) { try { await metaPending; } catch(e){} }
  const ok = await run(() => store.saveRecord({ id, author, marks,
    title: $('#add-title').value.trim().slice(0,200), channel: $('#add-channel').value.trim().slice(0,100), tags: parseTags($('#add-tags').value) }), `已儲存 ${marks.length} 筆`);
  btn.disabled = false; btn.textContent = '儲存紀錄';
  if (!ok) return;
  setName(author);
  for (const s of ['#add-url','#add-tags']) $(s).value = '';
  setMetaFields('', '', true, '貼上網址後自動帶入'); metaPending = null;
  $('#entries').innerHTML = ''; resetUrlHint();
  prevView = 'add';
  const go = () => getVideo(id) ? openVideo(id) : setTimeout(go, 150);
  go();
});

/* ---------- 備份 ---------- */
$('#export-btn').onclick = () => {
  const out = { videos: db.videos.map(v => ({ id:v.id, title:v.title, channel:v.channel, tags:v.tags, marks: v.marks.map(m => ({ t:m.t, note:m.note, author:m.author })) })) };
  const b = $('#export-box'); b.value = JSON.stringify(out, null, 1); b.hidden = false; $('#copy-btn').hidden = false; b.select();
};
$('#copy-btn').onclick = () => { const b = $('#export-box'); const p = navigator.clipboard && navigator.clipboard.writeText(b.value); if (p) p.then(() => toast('已複製'), () => { b.select(); toast('請按 Ctrl/⌘+C 複製'); }); else { b.select(); toast('請按 Ctrl/⌘+C 複製'); } };
async function mergeIn(text){
  const h = $('#import-hint');
  if (!isAdmin()) { h.className='hint err'; h.textContent = '只有管理者能匯入。'; return; }
  let d; try { d = JSON.parse(text); } catch(e){ h.className='hint err'; h.textContent = '資料格式不對，請貼上完整的備份內容。'; return; }
  if (!d || !Array.isArray(d.videos)) { h.className='hint err'; h.textContent = '找不到影片資料。'; return; }
  d.videos = d.videos.filter(v => v && /^[\w-]{11}$/.test(v.id)).map(v => ({ ...v, tags: Array.isArray(v.tags) ? v.tags.map(String).slice(0,30) : [], marks: (v.marks||[]).filter(m => typeof m.t === 'number') }));
  h.className='hint'; h.textContent = '匯入中…';
  let n = 0; const ok = await run(async () => { n = await store.importData(d); });
  if (ok) { h.className='hint ok'; h.textContent = `已匯入 ${n} 筆新時間點。`; }
}
$('#import-btn').onclick = () => mergeIn($('#import-box').value);
$('#import-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => mergeIn(r.result); r.readAsText(f); };

/* ---------- 啟動 ---------- */
setName(getName());
renderModeBanner();
renderAuth();
show('library');
(async () => {
  if (CLOUD) {
    try { store = await makeCloudStore(); }
    catch(e){ console.error(e); toast('無法連線到資料庫，暫時改用單機模式'); store = makeLocalStore(); }
  } else store = makeLocalStore();
  store.start();
})();
</script>
